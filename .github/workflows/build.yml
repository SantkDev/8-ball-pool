          cat > app/src/main/java/com/santk/poolaid/BubbleView.kt << 'EOF'
          package com.santk.poolaid

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.abs

          class BubbleView(c: Context) : View(c) {

              var onTap: () -> Unit = {}
              var onLong: () -> Unit = {}
              var onDrag: (Int, Int) -> Unit = { _, _ -> }

              private var active = false
              private var dragging = false
              private var longFired = false
              private var downX = 0f
              private var downY = 0f
              private var lastX = 0f
              private var lastY = 0f
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val longPress = Runnable {
                  if (!dragging) {
                      longFired = true
                      onLong()
                  }
              }

              fun setActive(v: Boolean) {
                  active = v
                  invalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  val cx = width / 2f
                  val cy = height / 2f
                  val rad = minOf(width, height) / 2f - 5f
                  p.style = Paint.Style.FILL
                  p.color = if (active) Color.argb(235, 18, 130, 86) else Color.argb(225, 18, 24, 32)
                  canvas.drawCircle(cx, cy, rad, p)
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 4f
                  p.color = if (active) Color.rgb(90, 255, 170) else Color.rgb(125, 145, 165)
                  canvas.drawCircle(cx, cy, rad - 2f, p)
                  p.style = Paint.Style.FILL
                  p.color = Color.WHITE
                  canvas.drawCircle(cx, cy, rad * 0.3f, p)
                  p.color = if (active) Color.rgb(18, 130, 86) else Color.rgb(18, 24, 32)
                  canvas.drawCircle(cx, cy, rad * 0.14f, p)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          downX = e.x
                          downY = e.y
                          lastX = e.rawX
                          lastY = e.rawY
                          dragging = false
                          longFired = false
                          postDelayed(longPress, 480)
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          if (abs(e.x - downX) > 14 || abs(e.y - downY) > 14) dragging = true
                          if (dragging) {
                              val dx = (e.rawX - lastX).toInt()
                              val dy = (e.rawY - lastY).toInt()
                              if (dx != 0 || dy != 0) {
                                  onDrag(dx, dy)
                                  lastX = e.rawX
                                  lastY = e.rawY
                              }
                          }
                          return true
                      }
                      MotionEvent.ACTION_UP -> {
                          removeCallbacks(longPress)
                          if (!dragging && !longFired) onTap()
                          return true
                      }
                      MotionEvent.ACTION_CANCEL -> removeCallbacks(longPress)
                  }
                  return super.onTouchEvent(e)
              }
          }
          EOF

          cat > app/src/main/java/com/santk/poolaid/HackService.kt << 'EOF'
          package com.santk.poolaid

          import android.app.Activity
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.view.Gravity
          import android.view.WindowManager
          import kotlin.math.hypot

          class HackService : Service() {

              private lateinit var wm: WindowManager
              private var overlay: OverlayView? = null
              private var bubble: BubbleView? = null
              private var projection: MediaProjection? = null
              private var display: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private var worker: HandlerThread? = null
              private var handler: Handler? = null

              private var frameW = 0
              private var frameH = 0
              private var busy = false
              private var enabled = true
              private var shot: Shot? = null
              private var table: TableVision.Table? = null

              override fun onBind(intent: Intent?): IBinder? = null

              @Suppress("DEPRECATION")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startForeground(1, notification())
                  if (intent == null) return START_STICKY

                  val data = intent.getParcelableExtra("data") as Intent?
                  if (data == null) return START_STICKY

                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  attachOverlay()

                  val code = intent.getIntExtra("code", Activity.RESULT_OK)
                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  projection = mpm.getMediaProjection(code, data)
                  startCapture()
                  return START_STICKY
              }

              private fun notification(): Notification {
                  val id = "poolaid"
                  val nm = getSystemService(NotificationManager::class.java)
                  if (nm.getNotificationChannel(id) == null) {
                      nm.createNotificationChannel(NotificationChannel(id, "PoolAid", NotificationManager.IMPORTANCE_LOW))
                  }
                  return Notification.Builder(this, id)
                      .setContentTitle("PoolAid activo")
                      .setContentText("Guias y disparo automatico")
                      .setSmallIcon(android.R.drawable.ic_menu_compass)
                      .setOngoing(true)
                      .build()
              }

              private fun attachOverlay() {
                  val ov = OverlayView(this)
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  wm.addView(ov, lp)
                  overlay = ov

                  val b = BubbleView(this)
                  val blp = WindowManager.LayoutParams(
                      132, 132,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  blp.gravity = Gravity.TOP or Gravity.START
                  blp.x = 28
                  blp.y = 240
                  b.onTap = {
                      enabled = !enabled
                      b.setActive(enabled)
                      if (!enabled) ov.render(null, null)
                  }
                  b.onLong = { shootNow() }
                  b.onDrag = { dx, dy ->
                      blp.x += dx
                      blp.y += dy
                      wm.updateViewLayout(b, blp)
                  }
                  wm.addView(b, blp)
                  bubble = b
              }

              private fun startCapture() {
                  val m = resources.displayMetrics
                  frameW = m.widthPixels
                  frameH = m.heightPixels
                  overlay?.scale = frameW / 720f

                  worker = HandlerThread("capture")
                  worker!!.start()
                  handler = Handler(worker!!.looper)

                  reader = ImageReader.newInstance(frameW, frameH, PixelFormat.RGBA_8888, 2)
                  display = projection!!.createVirtualDisplay(
                      "capture", frameW, frameH, m.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      reader!!.surface, null, handler
                  )

                  reader!!.setOnImageAvailableListener({ r ->
                      if (busy) return@setOnImageAvailableListener
                      val img = r.acquireLatestImage()
                      if (img == null) return@setOnImageAvailableListener
                      busy = true
                      try {
                          val plane = img.planes[0]
                          val stride = plane.rowStride / plane.pixelStride
                          val bmp = Bitmap.createBitmap(stride, img.height, Bitmap.Config.ARGB_8888)
                          bmp.copyPixelsFromBuffer(plane.buffer)
                          analyse(bmp)
                      } catch (e: Exception) {
                      } finally {
                          img.close()
                          busy = false
                      }
                  }, handler)
              }

              private fun analyse(full: Bitmap) {
                  val small = Bitmap.createScaledBitmap(full, 720, (full.height * 720f / full.width).toInt(), false)
                  val vision = TableVision()
                  val t = vision.findTable(small)
                  if (t == null) {
                      shot = null
                      table = null
                      if (enabled) overlay?.render(null, null)
                      return
                  }
                  val balls = vision.findBalls(small, t)
                  val cue = vision.pickCue(balls)
                  if (cue == null || balls.size < 2) {
                      shot = null
                      table = t
                      if (enabled) overlay?.render(null, t)
                      return
                  }
                  val s = Solver.solve(cue, balls.filter { it !== cue }, t)
                  shot = s
                  table = t
                  if (enabled) overlay?.render(s, t)
              }

              private fun shootNow() {
                  val s = shot ?: return
                  val t = table ?: return
                  val svc = AutoShooterService.inst ?: return
                  val k = frameW / 720f

                  val cx = s.cueX * k
                  val cy = s.cueY * k
                  val dx = s.ghostX * k - cx
                  val dy = s.ghostY * k - cy
                  val len = hypot(dx, dy)
                  if (len < 2f) return
                  val ux = dx / len
                  val uy = dy / len
                  val pull = t.width * k * 0.2f

                  val points = listOf(
                      cx to cy,
                      cx + dx * 0.12f to cy + dy * 0.12f,
                      cx - ux * pull to cy - uy * pull
                  )
                  svc.stroke(points, 460)
              }

              override fun onDestroy() {
                  bubble?.let { runCatching { wm.removeView(it) } }
                  overlay?.let { runCatching { wm.removeView(it) } }
                  reader?.close()
                  display?.release()
                  projection?.stop()
                  worker?.quitSafely()
                  super.onDestroy()
              }
          }
          EOF

      - name: Compilar APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Publicar artifacto
        uses: actions/upload-artifact@v4
        with:
          name: PoolAid-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Adjuntar al release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
