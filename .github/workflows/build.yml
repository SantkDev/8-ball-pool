name: build-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Generar proyecto
        run: |
          mkdir -p app/src/main/java/com/santk/poolaid
          mkdir -p app/src/main/res/values app/src/main/res/xml app/src/main/res/drawable

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PoolAid"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.santk.poolaid"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.santk.poolaid"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">PoolAid</string>
              <string name="a11y_desc">Permite que PoolAid dispare por ti en 8 Ball Pool.</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml << 'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:notificationTimeout="100"
              android:description="@string/a11y_desc" />
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0E1116" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#12A870" android:pathData="M54,14a40,40 0 1,0 0.2,0z" />
              <path android:fillColor="#FFFFFF" android:pathData="M54,32a22,22 0 1,0 0.2,0z" />
              <path android:fillColor="#0E1116" android:pathData="M54,45a9,9 0 1,0 0.2,0z" />
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".HackService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

                  <service
                      android:name=".AutoShooterService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/santk/poolaid/MainActivity.kt << 'EOF'
          package com.santk.poolaid

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.res.ColorStateList
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.RippleDrawable
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {

              private val reqCapture = 1001

              private val cBgTop = Color.parseColor("#0A0F14")
              private val cBgBottom = Color.parseColor("#0F1F1B")
              private val cCard = Color.parseColor("#151B23")
              private val cCardLine = Color.parseColor("#222C38")
              private val cChip = Color.parseColor("#1D2631")
              private val cGreen = Color.parseColor("#12A870")
              private val cGreenDark = Color.parseColor("#0E8A5C")
              private val cGreenLight = Color.parseColor("#3DDC97")
              private val cMuted = Color.parseColor("#8E99A8")
              private val cWarn = Color.parseColor("#FFB020")
              private val cDanger = Color.parseColor("#FF6B6B")

              private val match = ViewGroup.LayoutParams.MATCH_PARENT
              private val wrap = ViewGroup.LayoutParams.WRAP_CONTENT

              private lateinit var overlayStatus: TextView
              private lateinit var a11yStatus: TextView
              private lateinit var summary: TextView

              private class LogoView(c: Context) : View(c) {
                  private val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  override fun onDraw(canvas: Canvas) {
                      val cx = width / 2f
                      val cy = height / 2f
                      val r = minOf(width, height) / 2f
                      p.style = Paint.Style.FILL
                      p.color = Color.parseColor("#12A870")
                      canvas.drawCircle(cx, cy, r, p)
                      p.color = Color.WHITE
                      canvas.drawCircle(cx, cy, r * 0.56f, p)
                      p.color = Color.parseColor("#0E1116")
                      canvas.drawCircle(cx, cy, r * 0.24f, p)
                  }
              }

              private fun dp(v: Int): Int =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v.toFloat(), resources.displayMetrics).toInt()

              private fun rounded(color: Int, radius: Int, stroke: Int = 0, strokeColor: Int = 0): GradientDrawable {
                  val d = GradientDrawable()
                  d.setColor(color)
                  d.cornerRadius = dp(radius).toFloat()
                  if (stroke > 0) d.setStroke(dp(stroke), strokeColor)
                  return d
              }

              private fun tint(color: Int, alpha: Int): Int =
                  (color and 0x00FFFFFF) or (alpha shl 24)

              private fun params(w: Int, h: Int, top: Int = 0, bottom: Int = 0): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(w, h)
                  p.topMargin = dp(top)
                  p.bottomMargin = dp(bottom)
                  return p
              }

              override fun onCreate(state: Bundle?) {
                  super.onCreate(state)
                  window.statusBarColor = cBgTop
                  window.navigationBarColor = cBgBottom

                  val scroll = ScrollView(this)
                  scroll.background = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(cBgTop, cBgBottom))
                  scroll.isFillViewport = true
                  scroll.isVerticalScrollBarEnabled = false

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(dp(20), dp(24), dp(20), dp(28))
                  val contentWidth = minOf(resources.displayMetrics.widthPixels, dp(560))
                  scroll.addView(root, FrameLayout.LayoutParams(contentWidth, wrap, Gravity.CENTER_HORIZONTAL))

                  val header = LinearLayout(this)
                  header.orientation = LinearLayout.HORIZONTAL
                  header.gravity = Gravity.CENTER_VERTICAL
                  header.addView(LogoView(this), LinearLayout.LayoutParams(dp(52), dp(52)))

                  val titles = LinearLayout(this)
                  titles.orientation = LinearLayout.VERTICAL
                  titles.setPadding(dp(14), 0, 0, 0)

                  val title = TextView(this)
                  title.text = "PoolAid"
                  title.setTextColor(Color.WHITE)
                  title.setTextSize(TypedValue.COMPLEX_UNIT_SP, 30f)
                  title.typeface = Typeface.DEFAULT_BOLD
                  titles.addView(title)

                  val sub = TextView(this)
                  sub.text = "Asistente de tiro para 8 Ball Pool"
                  sub.setTextColor(cMuted)
                  sub.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f)
                  titles.addView(sub)

                  header.addView(titles, LinearLayout.LayoutParams(0, wrap, 1f))
                  root.addView(header, params(match, wrap, 0, 18))

                  summary = TextView(this)
                  root.addView(summary, params(wrap, wrap, 0, 16))

                  overlayStatus = TextView(this)
                  root.addView(stepCard(
                      "1", "Dibujar encima",
                      "Permite mostrar las guías de tiro sobre el juego.",
                      "Dar permiso", overlayStatus
                  ) {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  })

                  a11yStatus = TextView(this)
                  root.addView(stepCard(
                      "2", "Accesibilidad",
                      "Busca PoolAid en la lista y actívalo para que pueda disparar.",
                      "Abrir ajustes", a11yStatus
                  ) {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  })

                  root.addView(startCard())
                  root.addView(controlsCard())

                  val footer = TextView(this)
                  footer.text = "PoolAid  ·  v1.0"
                  footer.setTextColor(Color.parseColor("#5A6573"))
