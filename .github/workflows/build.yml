          cat > app/src/main/java/com/santk/poolaid/MainActivity.kt << 'EOF'
          package com.santk.poolaid

          import android.app.Activity
          import android.content.ComponentName
          import android.content.Intent
          import android.graphics.Color
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {

              private val reqCapture = 1001
              private lateinit var startBtn: Button
              private lateinit var overlayBtn: Button
              private lateinit var a11yBtn: Button

              override fun onCreate(state: Bundle?) {
                  super.onCreate(state)

                  val scroll = ScrollView(this)
                  scroll.fillViewport = true
                  scroll.fitsSystemWindows = true
                  scroll.setBackgroundColor(Color.parseColor("#0E1116"))

                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.gravity = Gravity.CENTER
                  box.setPadding(48, 32, 48, 64)
                  scroll.addView(
                      box,
                      ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  )

                  val title = TextView(this)
                  title.text = "PoolAid"
                  title.setTextColor(Color.WHITE)
                  title.textSize = 30f
                  box.addView(title)

                  val info = TextView(this)
                  info.text = "1. Permiso de dibujar encima\n2. Servicio de accesibilidad\n3. Permiso de captura\n4. EMPEZAR y abre el juego\n\nBurbuja: tocar = lineas, mantener = disparar"
                  info.setTextColor(Color.parseColor("#9AA4B2"))
                  info.textSize = 14f
                  info.setPadding(0, 20, 0, 24)
                  box.addView(info)

                  overlayBtn = makeButton("1. Permiso de dibujar encima") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  }
                  box.addView(overlayBtn)

                  a11yBtn = makeButton("2. Permiso de accesibilidad") { openA11y() }
                  box.addView(a11yBtn)

                  startBtn = makeButton("EMPEZAR") { begin() }
                  box.addView(startBtn)

                  box.addView(makeButton("DETENER") {
                      stopService(Intent(this, HackService::class.java))
                  })

                  setContentView(scroll)
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
              }

              private fun refresh() {
                  val ov = Settings.canDrawOverlays(this)
                  val a11y = a11yEnabled()

                  overlayBtn.text = if (ov) "1. Dibujar encima  [CONCEDIDO]" else "1. Permiso de dibujar encima  [FALTA]"
                  overlayBtn.setTextColor(if (ov) Color.rgb(90, 255, 170) else Color.WHITE)

                  a11yBtn.text = if (a11y) "2. Accesibilidad  [CONCEDIDO]" else "2. Permiso de accesibilidad  [FALTA]"
                  a11yBtn.setTextColor(if (a11y) Color.rgb(90, 255, 170) else Color.WHITE)

                  startBtn.isEnabled = ov && a11y
                  startBtn.alpha = if (startBtn.isEnabled) 1f else 0.45f
              }

              private fun a11yEnabled(): Boolean {
                  val cn = ComponentName(this, AutoShooterService::class.java)
                  val list = Settings.Secure.getString(
                      contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  val full = cn.flattenToString()
                  val short = cn.flattenToShortString()
                  return list.split(':').any { it.equals(full, true) || it.equals(short, true) }
              }

              private fun openA11y() {
                  val attempts = listOf(
                      Intent(Settings.ACTION_ACCESSIBILITY_DETAILS_SETTINGS, Uri.parse("package:$packageName")),
                      Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                  )
                  for (i in attempts) if (runCatching { startActivity(i) }.isSuccess) return
              }

              private fun makeButton(label: String, action: () -> Unit): Button {
                  val b = Button(this)
                  b.text = label
                  b.textSize = 15f
                  b.minHeight = 120
                  val lp = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  )
                  lp.bottomMargin = 14
                  b.layoutParams = lp
                  b.setOnClickListener { action() }
                  return b
              }

              private fun begin() {
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  if (!a11yEnabled()) {
                      openA11y()
                      return
                  }
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), 7)
                  }
                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  startActivityForResult(mpm.createScreenCaptureIntent(), reqCapture)
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(code: Int, result: Int, data: Intent?) {
                  super.onActivityResult(code, result, data)
                  if (code == reqCapture && result == RESULT_OK && data != null) {
                      val svc = Intent(this, HackService::class.java)
                      svc.putExtra("code", result)
                      svc.putExtra("data", data)
                      startForegroundService(svc)
                      val game = packageManager.getLaunchIntentForPackage("com.miniclip.eightballpool")
                      if (game != null) startActivity(game)
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/santk/poolaid/AutoShooterService.kt << 'EOF'
          package com.santk.poolaid

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent

          class AutoShooterService : AccessibilityService() {

              override fun onServiceConnected() {
                  inst = this
              }

              override fun onDestroy() {
                  if (inst === this) inst = null
                  super.onDestroy()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              fun stroke(points: List<Pair<Float, Float>>, ms: Long) {
                  if (points.size < 2) return
                  val path = Path()
                  path.moveTo(points[0].first, points[0].second)
                  for (i in 1 until points.size) path.lineTo(points[i].first, points[i].second)
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, ms))
                      .build()
                  dispatchGesture(gesture, null, null)
              }

              companion object {
                  @Volatile
                  var inst: AutoShooterService? = null
              }
          }
          EOF

          cat > app/src/main/java/com/santk/poolaid/TableVision.kt << 'EOF'
          package com.santk.poolaid

          import android.graphics.Bitmap
          import android.graphics.Color
          import kotlin.math.abs
          import kotlin.math.hypot

          class TableVision {

              class Table(val left: Int, val top: Int, val right: Int, val bottom: Int, val radius: Float) {
                  val width: Float get() = (right - left).toFloat()
                  val height: Float get() = (bottom - top).toFloat()
              }

              class Ball(val x: Float, val y: Float, val score: Float)

              fun findTable(bmp: Bitmap): Table? {
                  val w = bmp.width
                  val h = bmp.height
                  var minX = w
                  var minY = h
                  var maxX = 0
                  var maxY = 0
                  var count = 0
                  val step = 4
                  var y = 0
                  while (y < h) {
                      var x = 0
                      while (x < w) {
                          val c = bmp.getPixel(x, y)
                          val r = Color.red(c)
                          val g = Color.green(c)
                          val b = Color.blue(c)
                          val mx = maxOf(r, g, b)
                          val mn = minOf(r, g, b)
                          val sat = mx - mn
                          val green = g >= r && g >= b - 12
                          val blue = b >= r && b >= g - 12
                          val brown = r > g && g > b && mx in 40..175 && sat > 24
                          if (sat > 20 && mx > 34 && (green || blue || brown)) {
                              if (x < minX) minX = x
                              if (x > maxX) maxX = x
                              if (y < minY) minY = y
                              if (y > maxY) maxY = y
                              count++
                          }
                          x += step
                      }
                      y += step
                  }
                  if (count < (w * h / step / step) / 12) return null
                  if (maxX - minX < w / 3 || maxY - minY < h / 4) return null
                  val left = minX + 3
                  val right = maxX - 3
                  val top = minY + 3
                  val bottom = maxY - 3
                  if (right - left < 60 || bottom - top < 60) return null
                  val radius = maxOf(4f, (right - left) / 88f)
                  return Table(left, top, right, bottom, radius)
              }

              fun findBalls(bmp: Bitmap, t: Table): List<Ball> {
                  val cx = (t.left + t.right) / 2
                  val cy = (t.top + t.bottom) / 2
                  var sr = 0L
                  var sg = 0L
                  var sb = 0L
                  var n = 0
                  var dy = -24
                  while (dy <= 24) {
                      var dx = -24
                      while (dx <= 24) {
                          val x = cx + dx
                          val y = cy + dy
                          if (x >= 0 && y >= 0 && x < bmp.width && y < bmp.height) {
                              val c = bmp.getPixel(x, y)
                              sr += Color.red(c)
                              sg += Color.green(c)
                              sb += Color.blue(c)
                              n++
                          }
                          dx += 6
                      }
                      dy += 6
                  }
                  if (n == 0) return emptyList()
                  val fr = (sr / n).toInt()
                  val fg = (sg / n).toInt()
                  val fb = (sb / n).toInt()

                  val cell = maxOf(3, (t.radius / 1.6f).toInt())
                  val cols = (t.width / cell).toInt()
                  val rows = (t.height / cell).toInt()
                  if (cols < 5 || rows < 5) return emptyList()

                  val grid = Array(rows) { BooleanArray(cols) }
                  for (r in 0 until rows) {
                      for (c in 0 until cols) {
                          val x = (t.left + c * cell + cell / 2).toInt()
                          val y = (t.top + r * cell + cell / 2).toInt()
                          if (x < 0 || y < 0 || x >= bmp.width || y >= bmp.height) continue
                          val p = bmp.getPixel(x, y)
                          val d = abs(Color.red(p) - fr) + abs(Color.green(p) - fg) + abs(Color.blue(p) - fb)
                          val mx = maxOf(Color.red(p), Color.green(p), Color.blue(p))
                          grid[r][c] = d > 85 && mx > 55
                      }
                  }

                  val seen = Array(rows) { BooleanArray(cols) }
                  val out = ArrayList<Ball>()
                  for (r in 0 until rows) {
                      for (c in 0 until cols) {
                          if (!grid[r][c] || seen[r][c]) continue
                          var sumX = 0f
                          var sumY = 0f
                          var cells = 0
                          var minC = c
                          var maxC = c
                          var minR = r
                          var maxR = r
                          val stack = ArrayDeque<Int>()
                          stack.addLast(r * cols + c)
                          seen[r][c] = true
                          while (stack.isNotEmpty()) {
                              val v = stack.removeLast()
                              val rr = v / cols
                              val cc = v % cols
                              sumX += t.left + cc * cell + cell / 2f
                              sumY += t.top + rr * cell + cell / 2f
                              cells++
                              if (cc < minC) minC = cc
                              if (cc > maxC) maxC = cc
                              if (rr < minR) minR = rr
                              if (rr > maxR) maxR = rr
                              for (k in 0 until 4) {
                                  val nr = rr + (if (k == 0) -1 else if (k == 1) 1 else 0)
                                  val nc = cc + (if (k == 2) -1 else if (k == 3) 1 else 0)
                                  if (nr < 0 || nc < 0 || nr >= rows || nc >= cols) continue
                                  if (!grid[nr][nc] || seen[nr][nc]) continue
                                  seen[nr][nc] = true
                                  stack.addLast(nr * cols + nc)
                              }
                          }
                          if (cells < 3 || cells > 60) continue
                          val bw = maxC - minC + 1
                          val bh = maxR - minR + 1
                          val ratio = bw.toFloat() / bh.toFloat()
                          if (ratio < 0.55f || ratio > 1.8f) continue
                          val bx = sumX / cells
                          val by = sumY / cells
                          if (hypot(bx - cx, by - cy) < t.radius) continue
                          val col = bmp.getPixel(bx.toInt().coerceIn(0, bmp.width - 1), by.toInt().coerceIn(0, bmp.height - 1))
                          val mx = maxOf(Color.red(col), Color.green(col), Color.blue(col))
                          val mn = minOf(Color.red(col), Color.green(col), Color.blue(col))
                          out.add(Ball(bx, by, (mx - (mx - mn) * 0.6f).toFloat()))
                      }
                  }
                  return out
              }

              fun pickCue(balls: List<Ball>): Ball? = balls.maxByOrNull { it.score }
          }
          EOF

          cat > app/src/main/java/com/santk/poolaid/Solver.kt << 'EOF'
          package com.santk.poolaid

          import kotlin.math.acos
          import kotlin.math.hypot

          class Shot(
              val cueX: Float, val cueY: Float,
              val ghostX: Float, val ghostY: Float,
              val targetX: Float, val targetY: Float,
              val pocketX: Float, val pocketY: Float,
              val cut: Float, val blocked: Boolean, val bank: Boolean
          )

          object Solver {

              fun pockets(t: TableVision.Table): List<Pair<Float, Float>> {
                  val w = t.width
                  val h = t.height
                  val i = t.radius * 1.4f
                  return listOf(
                      t.left + i to t.top + i,
                      t.left + w / 2f to t.top + i * 0.5f,
                      t.right - i to t.top + i,
                      t.left + i to t.bottom - i,
                      t.left + w / 2f to t.bottom - i * 0.5f,
                      t.right - i to t.bottom - i
                  )
              }

              fun solve(cue: TableVision.Ball, balls: List<TableVision.Ball>, t: TableVision.Table): Shot? {
                  var best: Shot? = null
                  for (b in balls) {
                      for (p in pockets(t)) {
                          val s = tryShot(cue, b, p.first, p.second, t, balls, false) ?: continue
                          if (best == null || weight(s) < weight(best)) best = s
                      }
                  }
                  if (best != null && !best.blocked) return best
                  for (b in balls) {
                      for (p in pockets(t)) {
                          for (m in mirrors(t, p.first, p.second)) {
                              val s = tryShot(cue, b, m.first, m.second, t, balls, true) ?: continue
                              if (s.blocked) continue
                              if (best == null || weight(s) < weight(best)) best = s
                          }
                      }
                  }
                  return best
              }

              private fun weight(s: Shot): Float =
                  s.cut + (if (s.blocked) 45f else 0f) + (if (s.bank) 14f else 0f)

              private fun tryShot(
                  cue: TableVision.Ball, b: TableVision.Ball, px: Float, py: Float,
                  t: TableVision.Table, balls: List<TableVision.Ball>, bank: Boolean
              ): Shot? {
                  val r = t.radius
                  val ux = px - b.x
                  val uy = py - b.y
                  val ul = hypot(ux, uy)
                  if (ul < 1f) return null
                  val nx = ux / ul
                  val ny = uy / ul
                  val gx = b.x - nx * 2f * r
                  val gy = b.y - ny * 2f * r
                  val dx = gx - cue.x
                  val dy = gy - cue.y
                  val dl = hypot(dx, dy)
                  if (dl < 1f) return null
                  val ax = dx / dl
                  val ay = dy / dl
                  val dot = (ax * nx + ay * ny).coerceIn(-1f, 1f)
                  val cut = Math.toDegrees(acos(dot.toDouble())).toFloat()
                  if (cut > 84f) return null
                  if (gx < t.left - r || gx > t.right + r || gy < t.top - r || gy > t.bottom + r) return null
                  var blocked = false
                  for (o in balls) {
                      if (o === b) continue
                      if (dist(o.x, o.y, cue.x, cue.y, gx, gy) < r * 1.9f) { blocked = true; break }
                  }
                  return Shot(cue.x, cue.y, gx, gy, b.x, b.y, px, py, cut, blocked, bank)
              }

              private fun dist(px: Float, py: Float, ax: Float, ay: Float, bx: Float, by: Float): Float {
                  val dx = bx - ax
                  val dy = by - ay
                  val l2 = dx * dx + dy * dy
                  if (l2 < 0.0001f) return hypot(px - ax, py - ay)
                  val t = (((px - ax) * dx + (py - ay) * dy) / l2).coerceIn(0f, 1f)
                  return hypot(px - (ax + t * dx), py - (ay + t * dy))
              }

              private fun mirrors(t: TableVision.Table, px: Float, py: Float): List<Pair<Float, Float>> =
                  listOf(
                      px to 2f * t.top - py,
                      px to 2f * t.bottom - py,
                      2f * t.left - px to py,
                      2f * t.right - px to py
                  )
          }
          EOF

          cat > app/src/main/java/com/santk/poolaid/OverlayView.kt << 'EOF'
          package com.santk.poolaid

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.view.View

          class OverlayView(c: Context) : View(c) {

              var scale = 1f
              private var shot: Shot? = null
              private var table: TableVision.Table? = null
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val tx = Paint(Paint.ANTI_ALIAS_FLAG)

              init {
                  tx.color = Color.WHITE
                  tx.textSize = 32f
                  tx.setShadowLayer(5f, 0f, 0f, Color.BLACK)
              }

              fun render(s: Shot?, t: TableVision.Table?) {
                  shot = s
                  table = t
                  postInvalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  val s = shot ?: return
                  val k = scale

                  drawLine(canvas, Color.argb(110, 0, 255, 120), 16f, s.cueX, s.cueY, s.ghostX, s.ghostY, k)
                  drawLine(canvas, Color.rgb(0, 255, 120), 4f, s.cueX, s.cueY, s.ghostX, s.ghostY, k)
                  drawLine(canvas, Color.argb(100, 255, 210, 0), 14f, s.targetX, s.targetY, s.pocketX, s.pocketY, k)
                  drawLine(canvas, Color.rgb(255, 210, 0), 3f, s.targetX, s.targetY, s.pocketX, s.pocketY, k)

                  val r = (table?.radius ?: 8f) * k
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 3f
                  p.color = Color.rgb(0, 255, 120)
                  canvas.drawCircle(s.ghostX * k, s.ghostY * k, r, p)
                  p.color = Color.rgb(255, 80, 80)
                  canvas.drawCircle(s.pocketX * k, s.pocketY * k, r * 1.6f, p)
                  p.style = Paint.Style.FILL

                  val label = if (s.blocked) "BLOQUEADO" else "corte " + String.format("%.0f", s.cut)
                  tx.color = if (s.blocked) Color.rgb(255, 170, 60) else Color.WHITE
                  canvas.drawText(label, s.ghostX * k + r * 1.6f, s.ghostY * k - r * 0.6f, tx)
              }

              private fun drawLine(c: Canvas, color: Int, w: Float, x1: Float, y1: Float, x2: Float, y2: Float, k: Float) {
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = w
                  p.color = color
                  c.drawLine(x1 * k, y1 * k, x2 * k, y2 * k, p)
              }
          }
